<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediKiosk — Sign in</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#18202b;min-height:100vh;display:grid;place-items:center}.wrap{width:min(460px,92vw)}.brand{text-align:center;margin-bottom:22px}.logo{width:54px;height:54px;margin:auto;border-radius:16px;background:#183b56;color:#fff;display:grid;place-items:center;font-weight:800;font-size:25px}.brand h1{margin:12px 0 3px}.brand p{margin:0;color:#6b7480}.card{background:#fff;border:1px solid #e4e8ee;border-radius:18px;padding:28px;box-shadow:0 12px 35px #14283c14}label{display:block;font-size:13px;font-weight:700;margin:20px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #cfd6df;border-radius:10px;font-size:15px;box-sizing:border-box}button{width:100%;border:0;border-radius:10px;padding:13px 15px;font-weight:700;cursor:pointer;font-size:15px;margin-top:14px}.primary{background:#183b56;color:#fff}.secondary{background:#eef3f7;color:#183b56}.notice{margin-top:14px;padding:11px 12px;border-radius:9px;background:#f1f6fa;font-size:13px}.error{background:#fff1f1;color:#9b2c2c}.hidden{display:none}.back{display:block;text-align:center;margin-top:18px;color:#53606d;text-decoration:none;font-size:13px}</style></head><body><div class="wrap"><div class="brand"><div class="logo">M</div><h1>MediKiosk</h1><p>Intelligent Clinical Intake</p></div><div class="card"><h2>Passwordless sign in</h2><p>Use your email to receive a one-time verification code.</p><div id="emailStep"><label>Email</label><input id="email" type="email" autocomplete="email"><button id="send" class="primary">Send verification code</button></div><div id="codeStep" class="hidden"><label>Verification code</label><input id="code" inputmode="numeric" maxlength="6"><button id="verify" class="primary">Sign in</button><button id="back" class="secondary">Use another email</button></div><div id="msg"></div><a class="back" href="/">← Back to MediKiosk</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>const S=supabase.createClient(MEDIKIOSK_CONFIG.supabaseUrl,MEDIKIOSK_CONFIG.supabaseAnonKey),$=x=>document.getElementById(x),next=new URLSearchParams(location.search).get("next"),safe=next&&next.startsWith("/")?next:"/",msg=(x,e=false)=>$("msg").innerHTML='<div class="notice '+(e?"error":"")+'">'+x+'</div>';let email="";$("send").onclick=async()=>{email=$("email").value.trim();if(!email)return msg("Enter your email.",true);const {error}=await S.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)return msg(error.message,true);$("emailStep").classList.add("hidden");$("codeStep").classList.remove("hidden");msg("Verification code sent.");};$("verify").onclick=async()=>{const token=$("code").value.trim();const {error}=await S.auth.verifyOtp({email,token,type:"email"});if(error)return msg(error.message,true);location.href=safe};$("back").onclick=()=>location.reload();(async()=>{const {data}=await S.auth.getSession();if(data.session)location.href=safe})();</script></body></html>
