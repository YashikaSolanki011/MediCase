<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediKiosk — Sign in</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#18202b;min-height:100vh;display:grid;place-items:center}
.wrap{width:min(460px,92vw)}.brand{text-align:center;margin-bottom:22px}.logo{width:54px;height:54px;margin:auto;border-radius:16px;background:#183b56;color:#fff;display:grid;place-items:center;font-weight:800;font-size:25px}.brand h1{margin:12px 0 3px;font-size:28px}.brand p{margin:0;color:#6b7480}
.card{background:#fff;border:1px solid #e4e8ee;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(20,40,60,.08)}h2{margin:0 0 7px}.muted{color:#6b7480;font-size:14px;line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin:20px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #cfd6df;border-radius:10px;font-size:15px}button{width:100%;border:0;border-radius:10px;padding:13px 15px;font-weight:700;cursor:pointer;font-size:15px}.primary{background:#183b56;color:#fff;margin-top:14px}.secondary{background:#eef3f7;color:#183b56;margin-top:10px}.divider{display:flex;align-items:center;gap:10px;color:#9aa2ad;font-size:12px;margin:22px 0}.divider:before,.divider:after{content:"";height:1px;background:#e3e7ec;flex:1}.notice{margin-top:14px;padding:11px 12px;border-radius:9px;background:#f1f6fa;font-size:13px;line-height:1.45}.error{background:#fff1f1;color:#9b2c2c}.code{letter-spacing:5px;text-align:center;font-size:20px}.back{display:block;text-align:center;margin-top:18px;color:#53606d;text-decoration:none;font-size:13px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">M</div><h1>MediKiosk</h1><p>Intelligent Clinical Intake</p></div>
  <div class="card">
    <h2>User / Patient Login</h2>
    <p class="muted">Sign in with your email. MediKiosk uses a passwordless one-time code; your patient records are kept under your account.</p>
    <div id="emailStep">
      <label>Email address</label><input id="email" type="email" autocomplete="username webauthn" placeholder="you@example.com">
      <button class="primary" id="continueBtn">Continue</button>
    </div>
    <div id="codeStep" class="hidden">
      <label>6-digit verification code</label><input id="code" class="code" inputmode="numeric" maxlength="6" placeholder="123456">
      <button class="primary" id="verifyBtn">Sign in</button>
      <button class="secondary" id="backBtn">Use a different email</button>
    </div>
    <div id="message"></div>
    <div class="divider">STAFF ACCESS</div>
    <button class="secondary" onclick="location.href='/admin'">Admin login →</button>
  </div>
  <a class="back" href="/">← Back to MediKiosk</a>
</div>
<script>
const A=window.hatchable.auth;
const next=new URLSearchParams(location.search).get('next');
const safeNext=next && next.startsWith('/') ? next : '/';
let email='';
const $=id=>document.getElementById(id);
function msg(t,error=false){$('message').innerHTML='<div class="notice '+(error?'error':'')+'">'+t+'</div>';}
$('continueBtn').onclick=async()=>{
  email=$('email').value.trim();
  if(!email)return msg('Enter your email address.',true);
  try{
    const r=await A.startLogin({email});
    if(r.has_passkey && A.supportsPasskeys()){
      try{const done=await A.signInWithPasskey({email});location.href=safeNext;return}catch(e){}
    }
    $('emailStep').classList.add('hidden');$('codeStep').classList.remove('hidden');
    msg('A verification code was sent to '+email+'.');
  }catch(e){msg(e.message||'Could not start sign-in.',true);}
};
$('verifyBtn').onclick=async()=>{
  const code=$('code').value.trim();
  if(!code)return msg('Enter the verification code.',true);
  try{await A.verifyCode({email,code});location.href=safeNext;}
  catch(e){msg(e.message||'Invalid or expired code.',true);}
};
$('backBtn').onclick=()=>{$('codeStep').classList.add('hidden');$('emailStep').classList.remove('hidden');$('message').innerHTML='';$('code').value='';};
(async()=>{const s=await A.getSession();if(s?.user)location.href=safeNext;})();
</script>
</body></html>
