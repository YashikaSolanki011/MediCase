<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediKiosk — Admin</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#18202b;margin:0}.wrap{max-width:1050px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #e2e7ed;border-radius:15px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat b{display:block;font-size:30px;margin-top:8px}.muted{color:#71808e}.error{background:#fff0f0;color:#982f2f;padding:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>MediKiosk Admin</h1><p class="muted">Cumulative operational analytics only. Individual clinical records remain user-scoped.</p><div id="state">Checking access…</div><div id="dash" style="display:none"><div class="grid"><div class="card stat">Patient sessions<b id="patients">—</b></div><div class="card stat">Documents<b id="docs">—</b></div><div class="card stat">Users with records<b id="users">—</b></div><div class="card stat">Completed/reviewed<b id="completed">—</b></div><div class="card stat">Pending verification<b id="pending">—</b></div></div><div class="card"><h3>Patients by language</h3><pre id="languages"></pre></div><div class="card"><h3>Documents by type</h3><pre id="types"></pre></div><div class="card"><h3>30-day activity</h3><pre id="activity"></pre></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>const S=supabase.createClient(MEDIKIOSK_CONFIG.supabaseUrl,MEDIKIOSK_CONFIG.supabaseAnonKey),$=x=>document.getElementById(x);async function init(){const {data}=await S.auth.getSession();if(!data.session){location.href='/login?next=/admin';return}const r=await fetch('/api/admin/dashboard',{headers:{Authorization:'Bearer '+data.session.access_token}});if(r.status===403){$('state').innerHTML='<div class="error">This account is not an administrator.</div>';return}if(!r.ok){$('state').innerHTML='<div class="error">Admin service unavailable ('+r.status+').</div>';return}const d=await r.json();$('patients').textContent=d.stats.totalPatients;$('docs').textContent=d.stats.totalDocuments;$('users').textContent=d.stats.totalUsers;$('completed').textContent=d.stats.completedSessions;$('pending').textContent=d.stats.pendingDocuments;$('languages').textContent=JSON.stringify(d.breakdowns.languages,null,2);$('types').textContent=JSON.stringify(d.breakdowns.documentTypes,null,2);$('activity').textContent=JSON.stringify(d.breakdowns.activity30d,null,2);$('state').style.display='none';$('dash').style.display='block'}init();</script></body></html>
