[auth]
enabled = true
providers = ["email"]

[ai]
required = true
pin = "google"
description = "Google Gemini is used for clinical document OCR, structured extraction and physician-summary generation."

[[secret]]
name = "MEDIKIOSK_VISION_MODEL"
required = false
description = "Optional Gemini vision model override. Leave blank to use the configured default."

[[secret]]
name = "MEDIKIOSK_LLM_MODEL"
required = false
description = "Optional Gemini text model override. Leave blank to use the Hatchable Gemini alias."